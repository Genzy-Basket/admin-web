name: Deploy Admin Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v6
        id: pages

      # Not configure-pages' base_path: it derives /admin-web from the repo
      # name, but the custom domain serves from the root.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      # Pages serves static files, so a refresh on /kyc would 404 without this.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
